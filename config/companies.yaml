# ════════════════════════════════════════════════════════════════════════════
#  Ashborne Volt — company catalog
#
#  Every company here is listed on the Companies page. Those with `enabled: true`
#  (or `engine: cf` / `engine: browser`) are scraped by the GitHub Actions
#  workflow; the rest are a directory entry with a careers link.
#
#  Fields
#    name             display name (unique)
#    sector           Utility | Grid & Power OEM | Industrial & Automation |
#                     EPC & Consulting | Renewables & Storage |
#                     Data Centers & Facilities | Aerospace & Defense |
#                     Automotive & EV | Rail & Transit | RF & Communications |
#                     Electronics & Semiconductors
#    category         short descriptor shown under the name
#    hq               headquarters (city, state)
#    priority         S | A | B | C  (employer tier; drives ranking a little)
#    careers_url      public careers page (always set — the directory links to it)
#    ats_platform     workday | greenhouse | lever | ashby | smartrecruiters |
#                     icims | oracle | eightfold | phenom | jobs2web | avature |
#                     jobvite | radancy | amazon | generic
#    engine           "" (httpx, default) | cf (curl_cffi) | browser (Playwright)
#    enabled          scrape it?
#
#  Adapter keys (exact names — the adapters read these, nothing else):
#    workday:         workday_tenant, workday_instance, workday_career_site
#    greenhouse:      greenhouse_board        lever: lever_company
#    ashby:           ashby_org               smartrecruiters: smartrecruiters_company
#    icims:           icims_host              oracle: oracle_host + oracle_site
#    eightfold:       eightfold_tenant + eightfold_domain
#
#  Before enabling a company: verify the board belongs to THIS company. An
#  answering board can be a different organisation with the same short name.
# ════════════════════════════════════════════════════════════════════════════
