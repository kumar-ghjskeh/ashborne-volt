name: CI

# Every push and pull request: tests, build, dependency audits, secret scan.
# Data-only commits from the scraper skip this (they only touch frontend/public/data).

on:
  push:
    branches: [main]
    paths-ignore: ["frontend/public/data/**"]
  pull_request:
    paths-ignore: ["frontend/public/data/**"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - name: Install
        run: pip install -r backend/requirements.lock.txt pytest pip-audit
      - name: Tests
        run: cd backend && python -m pytest -q
      - name: Dependency audit (known vulnerabilities)
        run: pip-audit -r backend/requirements.lock.txt --progress-spinner off

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: CSP matches the built page
        run: python3 scripts/check_csp.py
      - name: Dependency audit (production deps, high+)
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
