<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Ashborne Volt">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#1b1408"/>
      <stop offset="0.6" stop-color="#0b0905"/>
      <stop offset="1" stop-color="#050403"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1b8"/>
      <stop offset="0.35" stop-color="#f4c542"/>
      <stop offset="0.7" stop-color="#d4921c"/>
      <stop offset="1" stop-color="#8a5a0c"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4c542" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8a5a0c" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- grid traces: transmission lines feeding the bolt -->
  <g stroke="#c8901f" stroke-opacity="0.35" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M40 150 H130 L160 180"/>
    <path d="M40 360 H120 L150 330"/>
    <path d="M472 150 H382 L352 180"/>
    <path d="M472 360 H392 L362 330"/>
    <path d="M256 30 V70"/>
    <path d="M256 442 V482"/>
  </g>
  <g fill="#f4c542" fill-opacity="0.55">
    <circle cx="40" cy="150" r="7"/><circle cx="40" cy="360" r="7"/>
    <circle cx="472" cy="150" r="7"/><circle cx="472" cy="360" r="7"/>
    <circle cx="256" cy="30" r="7"/><circle cx="256" cy="482" r="7"/>
  </g>
  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#ring)" stroke-width="6"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#f4c542" stroke-opacity="0.18" stroke-width="2"/>
  <!-- the bolt -->
  <path filter="url(#glow)" fill="url(#gold)"
        d="M292 92 L170 280 H246 L216 420 L346 222 H268 Z"/>
  <path fill="none" stroke="#fff7d6" stroke-opacity="0.65" stroke-width="3" stroke-linejoin="round"
        d="M292 92 L170 280 H246 L216 420"/>
</svg>
